<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="description" content="iPhone標準メモのようにシンプルに使える、TXT出力対応の端末内保存メモ。">
<title>カチッとメモ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#f2f2f7;--paper:#fff;--ink:#111114;--muted:#8e8e93;--line:#e5e5ea;
  --accent:#f4c542;--accent2:#ffd95c;--danger:#ff3b30;--blue:#0a84ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{width:min(980px,100%);margin:auto;min-height:100vh}
.top-safe{height:max(12px,env(safe-area-inset-top))}
.screen{display:none;min-height:100vh;background:var(--bg)}
.screen.active{display:block}
.nav{
  position:sticky;top:0;z-index:10;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);
  padding:8px 14px 10px;border-bottom:1px solid rgba(0,0,0,.04)
}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav-title{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 0}
.nav-btn{border:0;background:transparent;color:#d49f00;font-size:16px;font-weight:700;padding:8px 4px}
.circle-btn{border:0;background:var(--paper);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:20px}
.search-wrap{padding:10px 14px}
.search{
  width:100%;border:0;background:#e3e3e8;border-radius:12px;padding:10px 12px;font-size:15px;outline:none
}
.folder-tabs{display:flex;gap:8px;overflow:auto;padding:0 14px 10px;scrollbar-width:none}
.folder-tabs::-webkit-scrollbar{display:none}
.folder{border:0;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px;font-weight:700;color:#555}
.folder.active{background:var(--accent);color:#222}
.list{background:var(--paper);margin:0 14px;border-radius:14px;overflow:hidden}
.note-row{display:block;width:100%;border:0;background:#fff;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.note-row:last-child{border-bottom:0}
.note-row:active{background:#f7f7f9}
.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.row-title{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-pin{font-size:14px}
.row-preview{font-size:13px;color:#6f6f75;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:12px;color:#9a9aa0;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.8}
.bottom-bar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(980px,100%);
  background:rgba(249,249,249,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;z-index:20
}
.count-label{font-size:12px;color:var(--muted)}
.compose{border:0;background:transparent;color:#d49f00;font-size:25px;padding:4px 6px}
.editor-screen{background:#fff}
.editor-nav{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid rgba(0,0,0,.04);padding:8px 12px}
.editor-row{display:flex;align-items:center;justify-content:space-between}
.back-btn,.more-btn{border:0;background:transparent;color:#d49f00;font-size:16px;font-weight:700;padding:8px 4px}
.more-btn{font-size:22px}
.editor-main{padding:12px 16px 100px;max-width:760px;margin:auto}
.editor-area{width:100%;min-height:70vh;border:0;outline:none;resize:none;font-size:17px;line-height:1.55;color:#111;background:#fff;padding:0}
.editor-area::placeholder{color:#c0c0c5}
.editor-info{display:flex;justify-content:center;gap:8px;color:#a1a1a7;font-size:11px;margin:4px 0 12px}
.editor-toolbar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(980px,100%);
  display:flex;justify-content:space-around;align-items:center;background:rgba(249,249,249,.95);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20
}
.tool-btn{border:0;background:transparent;font-size:22px;padding:5px 10px;color:#d49f00}
.menu{
  position:fixed;right:14px;top:58px;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.16);
  padding:6px;min-width:190px;z-index:30;display:none
}
.menu.show{display:block}
.menu button,.menu label{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px 12px;border-radius:10px;font-size:14px}
.menu button:active,.menu label:active{background:#f2f2f7}
.menu .danger{color:var(--danger)}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,20px);opacity:0;background:#222;color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:780px){
  .app{display:grid;grid-template-columns:360px 1fr;gap:0}
  #listScreen{display:block!important;border-right:1px solid var(--line);min-height:100vh}
  #editorScreen{display:block!important;min-height:100vh}
  .bottom-bar{position:sticky;bottom:0;width:100%;transform:none;left:auto}
  .editor-toolbar{position:sticky;bottom:0;width:100%;transform:none;left:auto}
  .back-btn{visibility:hidden}
  .nav-title{font-size:28px}
}
</style>
</head>
<body>
<div class="app">
<section id="listScreen" class="screen active">
<div class="top-safe"></div>
<div class="nav">
  <div class="nav-row">
    <div><div class="nav-title">カチッとメモ</div></div>
    <button id="listMoreBtn" class="circle-btn">•••</button>
  </div>
</div>
<div class="search-wrap"><input id="searchInput" class="search" placeholder="検索"></div>
<div id="folderTabs" class="folder-tabs"></div>
<div id="noteList" class="list"></div>
<div class="bottom-bar">
  <span id="noteCount" class="count-label">0件のメモ</span>
  <button id="newBtn" class="compose">📝</button>
</div>
</section>

<section id="editorScreen" class="screen editor-screen">
<div class="editor-nav">
  <div class="editor-row">
    <button id="backBtn" class="back-btn">‹ メモ</button>
    <button id="moreBtn" class="more-btn">•••</button>
  </div>
</div>
<div class="editor-main">
  <div class="editor-info"><span id="updatedLabel"></span><span id="charLabel"></span></div>
  <textarea id="editor" class="editor-area" placeholder="新規メモ"></textarea>
</div>
<div class="editor-toolbar">
  <button id="pinBtn" class="tool-btn" title="ピン">📌</button>
  <button id="copyBtn" class="tool-btn" title="コピー">📋</button>
  <button id="exportBtn" class="tool-btn" title="TXT出力">⬇️</button>
  <button id="deleteBtn" class="tool-btn" title="削除">🗑️</button>
</div>
</section>
</div>

<div id="listMenu" class="menu">
  <button id="exportAllBtn">📦 全メモをTXT出力</button>
  <label for="importInput">📂 TXTを読み込む</label>
  <input id="importInput" type="file" accept=".txt,text/plain" multiple>
</div>

<div id="editorMenu" class="menu">
  <button id="copyMenuBtn">📋 本文をコピー</button>
  <button id="exportMenuBtn">⬇️ このメモをTXT出力</button>
  <button id="pinMenuBtn">📌 ピン留め</button>
  <button id="deleteMenuBtn" class="danger">🗑️ このメモを削除</button>
</div>

<div id="toast" class="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const STORE="kachittoMemoIOS.notes.v1";
const SELECTED="kachittoMemoIOS.selected.v1";
const FOLDER="kachittoMemoIOS.folder.v1";
const CATS=["すべて","未分類","仕事","生活","アイデア","学習","旅行","その他"];
let notes=load(),selectedId=localStorage.getItem(SELECTED)||null,currentFolder=localStorage.getItem(FOLDER)||"すべて",timer=null;

function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||"[]");return Array.isArray(v)?v:[]}catch{return []}}
function save(){localStorage.setItem(STORE,JSON.stringify(notes));selectedId?localStorage.setItem(SELECTED,selectedId):localStorage.removeItem(SELECTED);localStorage.setItem(FOLDER,currentFolder)}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function now(){return Date.now()}
function fmt(ts){if(!ts)return"";const d=new Date(ts);return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function current(){return notes.find(n=>n.id===selectedId)||null}
function titleOf(body){const line=(body||"").split(/\r?\n/).map(x=>x.trim()).find(Boolean);return (line||"新規メモ").slice(0,60)}
function previewOf(body){const lines=(body||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);return (lines.slice(1).join(" ")||lines[0]||"本文なし").slice(0,120)}
function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1300)}
function safeName(s){return (s||"メモ").replace(/[\\/:*?"<>|]/g,"_").slice(0,60)}
function showList(){if(innerWidth<780){$("#listScreen").classList.add("active");$("#editorScreen").classList.remove("active")}}
function showEditor(){if(innerWidth<780){$("#listScreen").classList.remove("active");$("#editorScreen").classList.add("active")}}
function closeMenus(){$("#listMenu").classList.remove("show");$("#editorMenu").classList.remove("show")}

function renderFolders(){
  const root=$("#folderTabs");root.innerHTML="";
  CATS.forEach(c=>{const b=document.createElement("button");b.className="folder"+(c===currentFolder?" active":"");b.textContent=c;b.onclick=()=>{currentFolder=c;save();renderFolders();renderList()};root.appendChild(b)})
}
function renderList(){
  const q=$("#searchInput").value.trim().toLowerCase();
  const arr=[...notes].sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(b.updatedAt-a.updatedAt)).filter(n=>{
    const folderOk=currentFolder==="すべて"||n.category===currentFolder;
    const qOk=!q||(n.body||"").toLowerCase().includes(q);
    return folderOk&&qOk;
  });
  const root=$("#noteList");root.innerHTML="";
  if(!arr.length){root.innerHTML=`<div class="empty">${notes.length?"該当するメモがありません。":"メモがありません。<br>右下の📝から作れます。"}</div>`}
  arr.forEach(n=>{
    const b=document.createElement("button");b.className="note-row";
    b.innerHTML=`<div class="row-top"><span class="row-title">${escapeHtml(titleOf(n.body))}</span><span class="row-pin">${n.pinned?"📌":""}</span></div><div class="row-preview">${escapeHtml(previewOf(n.body))}</div><div class="row-meta">${fmt(n.updatedAt)} ・ ${escapeHtml(n.category||"未分類")}</div>`;
    b.onclick=()=>{selectedId=n.id;save();renderEditor();showEditor()};root.appendChild(b)
  });
  $("#noteCount").textContent=`${notes.length}件のメモ`;
}
function renderEditor(){
  const n=current();
  if(!n){$("#editor").value="";$("#updatedLabel").textContent="";$("#charLabel").textContent="";return}
  $("#editor").value=n.body||"";
  $("#updatedLabel").textContent=fmt(n.updatedAt);
  $("#charLabel").textContent=`${Array.from(n.body||"").length}文字`;
  $("#pinBtn").style.opacity=n.pinned?"1":".45";
  $("#pinMenuBtn").textContent=n.pinned?"📌 ピン留めを外す":"📌 ピン留め";
}
function render(){renderFolders();renderList();renderEditor()}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function createNote(body=""){
  const t=now(),n={id:uid(),body,category:currentFolder==="すべて"?"未分類":currentFolder,pinned:false,createdAt:t,updatedAt:t};
  notes.unshift(n);selectedId=n.id;save();render();showEditor();setTimeout(()=>$("#editor").focus(),50)
}
function scheduleSave(){
  clearTimeout(timer);timer=setTimeout(()=>{const n=current();if(!n)return;n.body=$("#editor").value;n.updatedAt=now();save();renderList();$("#updatedLabel").textContent=fmt(n.updatedAt);$("#charLabel").textContent=`${Array.from(n.body).length}文字`},220)
}
function togglePin(){
  const n=current();if(!n)return;n.pinned=!n.pinned;n.updatedAt=now();save();render();toast(n.pinned?"ピン留めしました":"ピン留めを外しました")
}
function removeCurrent(){
  const n=current();if(!n)return;if(!confirm("このメモを削除しますか？"))return;
  notes=notes.filter(x=>x.id!==n.id);selectedId=notes[0]?.id||null;save();render();showList();toast("削除しました")
}
async function copyCurrent(){
  const n=current();if(!n)return;try{await navigator.clipboard.writeText(n.body||"");toast("コピーしました")}catch{$("#editor").select();document.execCommand("copy");toast("コピーしました")}
}
function download(name,text){
  const blob=new Blob(["\ufeff"+text],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
function exportCurrent(){
  const n=current();if(!n)return;const d=new Date(n.updatedAt),stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;download(`${safeName(titleOf(n.body))}_${stamp}.txt`,n.body||"");toast("TXTを書き出しました")
}
function exportAll(){
  if(!notes.length)return toast("メモがありません");
  const arr=[...notes].sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(b.updatedAt-a.updatedAt));
  const text=arr.map(n=>`【${titleOf(n.body)}】\n${n.body||""}`).join("\n\n------------------------------\n\n");
  const d=new Date(),stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  download(`カチッとメモ_${stamp}.txt`,text);toast("全メモを書き出しました")
}
async function importFiles(files){
  for(const file of files){const text=(await file.text()).replace(/^\uFEFF/,"");createNote(text||file.name.replace(/\.txt$/i,""))}
  render();showList();toast(`${files.length}件読み込みました`)
}

$("#newBtn").onclick=()=>createNote();
$("#searchInput").oninput=renderList;
$("#editor").oninput=scheduleSave;
$("#backBtn").onclick=showList;
$("#pinBtn").onclick=togglePin;
$("#copyBtn").onclick=copyCurrent;
$("#exportBtn").onclick=exportCurrent;
$("#deleteBtn").onclick=removeCurrent;
$("#listMoreBtn").onclick=e=>{e.stopPropagation();$("#listMenu").classList.toggle("show");$("#editorMenu").classList.remove("show")};
$("#moreBtn").onclick=e=>{e.stopPropagation();$("#editorMenu").classList.toggle("show");$("#listMenu").classList.remove("show")};
$("#exportAllBtn").onclick=()=>{closeMenus();exportAll()};
$("#copyMenuBtn").onclick=()=>{closeMenus();copyCurrent()};
$("#exportMenuBtn").onclick=()=>{closeMenus();exportCurrent()};
$("#pinMenuBtn").onclick=()=>{closeMenus();togglePin()};
$("#deleteMenuBtn").onclick=()=>{closeMenus();removeCurrent()};
$("#importInput").onchange=e=>{const f=[...e.target.files];if(f.length)importFiles(f);e.target.value=""};
document.addEventListener("click",closeMenus);

if(!notes.length)createNote("カチッとメモへようこそ\n\n1行目が自動でタイトルになります。\nメモは端末内に自動保存されます。\n「•••」や下の⬇️からTXT出力もできます。");
else{if(!notes.some(n=>n.id===selectedId))selectedId=notes[0].id;save();render()}
if(innerWidth<780)showList();

if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
